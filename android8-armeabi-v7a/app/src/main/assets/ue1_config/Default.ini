; Android default configuration copied on first start if System/Default.ini is missing.
; Keep this file close to Unreal.ini so the original UE1 first-run copy logic has a fallback.

[Engine.Engine]
GameRenderDevice=NOpenGLESDrv.NOpenGLESRenderDevice
WindowedRenderDevice=NOpenGLESDrv.NOpenGLESRenderDevice
AudioDevice=NOpenALDrv.NOpenALAudioSubsystem
Console=Engine.Console
Language=int
GameEngine=Engine.GameEngine
DefaultGame=UnrealI.SinglePlayer
ViewportManager=NSDLDrv.NSDLClient

[Core.System]
SavePath=../Save
CachePath=../Cache
CacheExt=.uxx
Paths=../System/*.u
Paths=../Maps/*.unr
Paths=../Textures/*.utx
Paths=../Sounds/*.uax
Paths=../Music/*.umx
Paths=../Meshes/*.u

[NSDLDrv.NSDLClient]
Brightness=0.5
Gamma=1.0
AndroidResolutionMode=0
StartupFullscreen=True
UseJoystick=True
AndroidNativeController=True
AndroidNativeRightStickScale=1.00 ; UNREAL_ANDROID_CONTROLLER_DIRECT_V122
AndroidNativeLeftStickDeadzone=0.08 ; UNREAL_ANDROID_CONTROLLER_DIRECT_V122
AndroidNativeRightStickDeadzone=0.10 ; UNREAL_ANDROID_CONTROLLER_DIRECT_V122
AndroidNativeTriggerDeadzone=0.12 ; UNREAL_ANDROID_CONTROLLER_DIRECT_V122
AndroidNativeAxisCurve=1.00 ; UNREAL_ANDROID_CONTROLLER_DIRECT_V122
DeadZoneXYZ=0.10
DeadZoneRUV=0.10
ScaleXYZ=100.0
ScaleRUV=100.0
InvertY=False
InvertV=False
LowDetailTextures=False

AndroidNativeDirectInput=True ; UNREAL_ANDROID_CONTROLLER_DIRECT_V122
[NOpenGLESDrv.NOpenGLESRenderDevice]
VolumetricLighting=True
ShinySurfaces=True
Coronas=True
HighDetailActors=True
AutoFOV=True
SwapInterval=1
DetailTextures=True
Overbright=True
BrightnessScale=1.0
WorldGamma=1.0
WorldShadowLift=0.0

[UnrealI.UnrealHUD]
HudMode=0
Crosshair=0

[Unreal.UnrealHUD]
HudMode=0
Crosshair=0

; v88: resets native controller debounce state on pause/resume/focus to avoid first button press being swallowed. ANDROID_CONTROLLER_NATIVE_RESET_V88

[WinDrv.WindowsClient]
UseJoystick=True
