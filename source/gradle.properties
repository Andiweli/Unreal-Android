org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# OUYA/API16 (armeabi-v7a) optimisation of the UnrealScript VM and engine event code.
# fast = default, balanced = all -O1, safe = old -O0 build (only for A/B testing).
unreal.api16NativeOpt=fast
